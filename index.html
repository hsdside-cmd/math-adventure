<script type="module">const subjects = [
 {id:'square',name:'사각형',sub:'네 개의 변, 무한한 발견',desc:'닮은 듯 다른 사각형의 비밀을 찾아요.',color:'green',symbol:'□',topics:['꼭짓점과 변','직각 찾기','수직과 평행','사다리꼴','평행사변형','마름모','직사각형','정사각형','사각형의 각의 합','사각형 종합 탐험'],details:['사각형을 이루는 요소를 알아봐요','90°인 각을 찾아봐요','만나는 선과 나란한 선을 구분해요','평행한 변을 찾아봐요','마주 보는 변과 각을 살펴봐요','네 변의 길이가 같은 도형이에요','네 각이 모두 직각인 도형이에요','변도 같고, 각도 같은 특별한 도형','네 각을 모으면 360°가 돼요','배운 사각형을 함께 만나봐요']},
 {id:'triangle',name:'삼각형',sub:'세 꼭짓점의 신나는 모험',desc:'변과 각을 따라 삼각형을 탐험해요.',color:'orange',symbol:'△',topics:['삼각형의 구성','각의 종류','이등변삼각형','정삼각형','예각삼각형','직각삼각형','둔각삼각형','삼각형의 각의 합','삼각형 분류하기','삼각형 종합 탐험'],details:['세 변과 세 꼭짓점을 만나요','예각, 직각, 둔각을 구분해요','길이가 같은 두 변을 찾아요','세 변과 세 각이 모두 같아요','세 각이 모두 뾰족한 삼각형','직각이 있는 삼각형을 찾아요','둔각이 있는 삼각형을 찾아요','세 각을 더하면 얼마일까요?','변과 각의 특징으로 분류해요','삼각형 박사에 도전해요']},
 {id:'multiply',name:'곱셈과 나눗셈',sub:'묶고 나누면 쉬워져요',desc:'수의 규칙을 발견하고 계산 힘을 길러요.',color:'purple',symbol:'×',topics:['곱셈의 뜻','구구단 탐험','두 자리 수 × 한 자리 수','세 자리 수 × 한 자리 수','두 자리 수 × 두 자리 수','나눗셈의 뜻','나머지가 없는 나눗셈','나머지가 있는 나눗셈','두 자리 수로 나누기','생활 속 곱셈과 나눗셈'],details:['같은 수를 여러 번 더해요','2단부터 9단까지 익혀요','자릿값에 맞춰 곱해요','더 큰 수도 차근차근 곱해요','도전에서는 세 자리 수도 곱해요','똑같이 나누는 방법을 배워요','곱셈으로 몫을 찾아봐요','나누고 남은 수를 알아봐요','두 자리 수로 차근차근 나눠요','일상에서 계산을 활용해요']},
 {id:'decimal',name:'소수의 덧셈과 뺄셈',sub:'작은 수로 만드는 큰 자신감',desc:'소수점을 맞추고 한 칸씩 계산해요.',color:'blue',symbol:'.',topics:['소수와 자릿값','소수의 크기 비교','소수 한 자리 덧셈','소수 한 자리 뺄셈','받아올림이 있는 덧셈','받아내림이 있는 뺄셈','소수 두 자리 덧셈','소수 두 자리 뺄셈','자릿수가 다른 소수','생활 속 소수 계산'],details:['0.1과 0.01의 의미를 알아요','어떤 소수가 더 큰지 비교해요','소수점을 맞춰 더해요','같은 자리끼리 빼봐요','10개가 모이면 한 자리 위로!','윗자리에서 1을 빌려와요','소수 둘째 자리까지 더해요','소수 둘째 자리까지 빼요','빈자리에 0을 채워 계산해요','길이와 무게를 계산해요']}
];
const fmt=n=>Number(n.toFixed(2)).toString();
function rng(seed){let x=seed|0;return(a,b)=>{x=(Math.imul(x,1664525)+1013904223)|0;return a+((x>>>0)%(b-a+1));};}
function choice(prompt,answer,options,hint,explanation,diagram){return {prompt,answer:String(answer),options:options.map(String),hint,explanation,diagram};}
function num(prompt,answer,hint,explanation,extra={}){return {prompt,answer:fmt(answer),hint,explanation,...extra};}
function shape(type,labels=[]){
 const paths={square:'M82 25 H198 V141 H82Z',rectangle:'M45 38 H235 V132 H45Z',parallelogram:'M90 38 H240 L190 132 H40Z',rhombus:'M140 15 L235 85 L140 155 L45 85Z',trapezoid:'M95 35 H185 L235 135 H45Z',triangle:'M140 20 L230 140 H50Z',equilateral:'M140 15 L215 145 H65Z',right:'M65 25 V140 H220Z',obtuse:'M65 140 L110 90 L235 140Z',acute:'M140 20 L215 140 H65Z'};
 const p=paths[type]||paths.triangle;
 return `<svg viewBox="0 0 280 180" role="img" aria-label="${({square:'정사각형',rectangle:'직사각형',parallelogram:'평행사변형',rhombus:'마름모',trapezoid:'사다리꼴',equilateral:'정삼각형',right:'직각삼각형',obtuse:'둔각삼각형',acute:'예각삼각형',triangle:'삼각형'})[type]}"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#cbd9d1"/></pattern></defs><rect width="280" height="180" fill="url(#grid)"/><path d="${p}" fill="#dbefdc" stroke="#28836a" stroke-width="3.5" stroke-linejoin="round"/>${['square','rectangle'].includes(type)?`<path d="${type==='square'?'M82 40 H97 V25':'M45 53 H60 V38'}" fill="none" stroke="#28836a" stroke-width="2"/>`:type==='right'?'<path d="M65 125 H80 V140" fill="none" stroke="#28836a" stroke-width="2"/>':''}${labels.map((v,i)=>`<text x="${[140,248,140,30][i]}" y="${[19,91,168,91][i]}" text-anchor="middle" font-size="14" font-weight="700" fill="#334e45">${v}</text>`).join('')}</svg>`;
}
function makeQuestion(s,t,l,i,seed=27){
 const r=rng(seed+s*10000+t*600+l*91+i*13), a=r(2+2*l,7+4*l), b=r(2,5+l), k=(i+l)%5;
 if(s===0){
  if(t===0){const n=l===0?1:r(2,3+l),type=i%2?'꼭짓점':'변';return num(`${n===1?'사각형 한 개':`서로 떨어진 사각형 ${n}개`}의 ${type}은 모두 몇 개인가요?`,4*n,'사각형 하나에는 변 4개와 꼭짓점 4개가 있어요.',`사각형 ${n}개이므로 4 × ${n} = ${4*n}개예요.`,{unit:'개',diagram:shape('square')});}
  if(t===1){if(k<2)return num(`직사각형 ${l+1}개에는 직각이 모두 몇 개 있나요?`,4*(l+1),'직사각형 한 개의 네 각은 모두 직각이에요.',`4 × ${l+1} = ${4*(l+1)}개예요.`,{unit:'개',diagram:shape('rectangle')});const angles=[r(20,80),90,r(100,160),180];return choice('직각의 크기는 얼마인가요?',90,angles,'반듯한 종이 모서리의 각을 떠올려요.','직각은 90°예요.',[''].join(''));}
  if(t===2){const pool=[['두 직선이 만나 직각을 이룰 때, 두 직선은 어떤 관계인가요?','수직',['수직','평행','같은 직선','알 수 없음'],'직각으로 만나는 모습을 떠올려요.','두 직선이 만나 직각을 이루면 서로 수직이에요.'],['끝없이 늘여도 만나지 않는 두 직선은 어떤 관계인가요?','평행',['평행','수직','서로 교차','같은 점'],'기찻길의 두 선을 떠올려요.','같은 평면에서 만나지 않는 두 직선은 서로 평행해요.'],['직사각형에서 마주 보는 두 변은 어떤 관계인가요?','평행',['평행','수직','한 점에서 만남','길이가 다름'],'위쪽 변과 아래쪽 변을 살펴봐요.','직사각형의 마주 보는 변은 서로 평행해요.'],['정사각형에서 이웃한 두 변은 어떤 관계인가요?','수직',['수직','평행','같은 변','알 수 없음'],'이웃한 변이 이루는 각은 90°예요.','정사각형의 이웃한 두 변은 서로 수직이에요.'],['직사각형에서 평행한 변은 몇 쌍인가요?','2쌍',['1쌍','2쌍','3쌍','4쌍'],'위와 아래, 왼쪽과 오른쪽을 짝지어요.','마주 보는 변 두 쌍이 각각 평행해요.']];return choice(...pool[k],shape('rectangle'));}
  if(t===3){const qs=[['적어도 한 쌍의 마주 보는 변이 평행한 사각형은?','사다리꼴',['사다리꼴','삼각형','원','오각형'],'이름이 사다리와 닮았어요.','적어도 한 쌍의 대변이 평행한 사각형을 사다리꼴이라고 해요.'],['그림에서 위쪽 변과 아래쪽 변의 관계는?','평행',['평행','수직','길이가 같음','서로 교차'],'두 변을 길게 늘여 보세요.','위쪽과 아래쪽 변은 서로 만나지 않는 평행한 변이에요.'],['사다리꼴도 사각형일까요?','예',['예','아니요'],'변의 개수를 세어 보세요.','변이 네 개이므로 사각형이에요.'],['그림의 사다리꼴에서 아래쪽 변과 평행한 변은?','위쪽 변',['위쪽 변','왼쪽 변','오른쪽 변'],'아래쪽 변과 같은 방향인 변을 찾아요.','위쪽 변과 아래쪽 변을 늘여도 서로 만나지 않아요.'],['그림에서 평행한 변은 몇 쌍인가요?','1쌍',['1쌍','2쌍','3쌍','0쌍'],'위쪽과 아래쪽 변을 보세요.','이 그림에는 평행한 변이 한 쌍 있어요.']];return choice(...qs[k],shape('trapezoid'));}
  if(t===4){if(k%2===0)return num(`평행사변형의 위쪽 변이 ${a} cm예요. 아래쪽 변은 몇 cm인가요?`,a,'마주 보는 변의 길이는 같아요.',`마주 보는 변이므로 아래쪽도 ${a} cm예요.`,{unit:'cm',diagram:shape('parallelogram',[a+' cm','','?'])});return choice('평행사변형의 성질로 알맞은 것은?','마주 보는 두 쌍의 변이 평행해요',['마주 보는 두 쌍의 변이 평행해요','네 각은 항상 직각이에요','네 변은 항상 길이가 같아요','변이 세 개예요'],'이름 속에 성질이 숨어 있어요.','평행사변형은 마주 보는 두 쌍의 변이 각각 평행하고 길이도 같아요.',shape('parallelogram'));}

function start(s,t,l){if(!unlocked(s,t,l))return;const seed=Math.floor(Math.random()*1000000);state.session={s,t,l,seed,index:0,answers:[],questions:Array.from({length:5},(_,i)=>{const q=makeQuestion(s,t,l,i,seed);if(q.options){q.options=q.options.map(v=>({v,sort:Math.random()})).sort((a,b)=>a.sort-b.sort).map(x=>x.v);}return q;}),finished:false,recorded:false};save();selected='';hint=false;error='';location.hash=`#play/${s}/${t}/${l}`;render();}
function questionHTML(q,answered,answer,correct){return `<div class="question-card"><div class="question-meta"><span class="question-pill">${q.options?'알맞은 답을 골라요':'답을 직접 써 봐요'}</span><span>천천히 생각해도 괜찮아요</span></div><h2>${esc(q.prompt)}</h2>${q.diagram?`<div class="diagram">${q.diagram}</div><p class="diagram-note">그림은 이해를 돕기 위한 예시예요. 주어진 조건을 이용해요.</p>`:''}${q.equation?`<div class="equation">${esc(q.equation)}</div>`:''}<form id="answer-form">${q.options?`<div class="choices" role="group" aria-label="답 선택">${q.options.map((v,i)=>`<button type="button" class="choice ${selected===v||answer===v?'selected':''} ${answered&&v===q.answer?'correct-option':''}" data-action="choose" data-value="${esc(v)}" ${answered?'disabled':''} aria-pressed="${selected===v||answer===v}"><i>${i+1}</i>${esc(v)}</button>`).join('')}</div>`:`<label class="answer-label" for="answer">숫자로 답을 입력하세요</label><div class="answer-wrap"><input id="answer" name="answer" inputmode="decimal" autocomplete="off" placeholder="정답" aria-label="정답" value="${esc(answer||selected)}" ${answered?'disabled':''} maxlength="14"><span>${q.unit||''}</span></div>`}${error?`<p class="error" role="alert">${error}</p>`:''}${hint?`<div class="hint-box">💡 ${esc(q.hint)}</div>`:''}${answered?`<div class="feedback ${correct?'':'wrong'}" role="status"><strong>${correct?'정답이에요! 잘했어요.':'괜찮아요! 풀이를 함께 살펴봐요.'}</strong>${!correct?`<p>정답: <b>${esc(q.answer)}${q.unit?' '+q.unit:''}</b></p>`:''}<p class="answer-detail">${esc(q.explanation)}</p></div>`:''}<div class="quiz-controls"><button type="button" class="hint-btn" data-action="hint">${icon('bulb',16)}${hint?'힌트 접기':'힌트 보기'}</button>${answered?`<button type="button" class="btn primary" data-action="${review?'review-next':'next'}">${review?'복습 목록으로':state.session.index===4?'탐험 결과 보기':'다음 문제'}${icon('arrow',15)}</button>`:'<button type="submit" class="btn primary">정답 확인하기</button>'}</div></form></div>`;}
function quizPage(s,t,l){nav('play',s);if(!unlocked(s,t,l)){location.hash=`#topic/${s}/${t}`;return '';}
 if(!state.session||state.session.s!==s||state.session.t!==t||state.session.l!==l){start(s,t,l);return '';}
 const g=state.session;if(g.finished)return resultPage(g);const q=g.questions[g.index],a=g.answers[g.index];return `<div class="quiz-shell"><a class="back-link" href="#topic/${s}/${t}">${icon('back',14)}나가기 · 여기까지 자동 저장돼요</a><div class="quiz-top"><div><h1>${subjects[s].topics[t]}</h1><p>${subjects[s].name} · ${stageNames[l]} 탐험</p></div><div class="quiz-count"><b>${g.index+1}</b> / 5 문제</div></div><div class="progress-track quiz-track"><span style="width:${g.index/5*100}%"></span></div>${questionHTML(q,!!a,a?.value,a?.correct)}<p class="quiz-note">정답보다 중요한 건, 스스로 생각해 보는 힘이에요.</p></div>`;}
function answerQuestion(){const g=state.session,q=review?review.q:g.questions[g.index];if(review?.answer||!review&&g.answers[g.index])return;const val=q.options?selected:$('#answer')?.value.trim();if(!val){error='답을 입력하거나 선택해 주세요.';render();return;}if(!q.options&&!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(val)){selected=val;error='0 이상의 숫자를 입력해 주세요. 소수는 점(.)을 사용해요.';render();return;}
 const correct=isCorrect(val,q),a={value:val,correct};if(review){review.answer=a;if(correct)state.mistakes=state.mistakes.filter(m=>m.id!==review.id);}else{g.answers[g.index]=a;state.history.push({day:dayKey(),s:g.s,t:g.t,l:g.l,correct});if(state.history.length>20000)state.history=state.history.slice(-20000);if(!correct){const id=`${g.s}-${g.t}-${g.l}-${g.seed}-${g.index}`;state.mistakes.unshift({id,q,s:g.s,t:g.t,l:g.l});state.mistakes=state.mistakes.slice(0,120);}}
 save();error='';selected='';render();}
function next(){const g=state.session;if(!g.answers[g.index])return;if(g.index<4){g.index++;}else{g.finished=true;if(!g.recorded){const score=g.answers.filter(a=>a.correct).length,key=`${g.s}-${g.t}-${g.l}`;state.results[key]={best:Math.max(state.results[key]?.best||0,score),last:score,day:dayKey()};g.recorded=true;save();if(score>=4)confetti();}}selected='';hint=false;error='';save();render();}
function resultPage(g){const score=g.answers.filter(a=>a.correct).length,pass=score>=4;return `<div class="result"><div class="result-icon">${icon(pass?'award':'book',48)}</div><div class="eyebrow" style="justify-content:center">${stageNames[g.l]} 탐험 완료</div><h1>${pass?'한 뼘 더 성장했어요!':'한 번 더 하면, 더 잘할 수 있어요!'}</h1><p>${subjects[g.s].topics[g.t]} 탐험을 마쳤어요.<br>${pass?(g.l<2?'다음 탐험의 문이 열렸어요. 새로운 도전을 만나 볼까요?':'세 단계의 여정을 모두 마쳤어요. 정말 멋져요!'):'풀이를 떠올리며 다시 도전해 봐요. 4개 이상 맞히면 통과예요.'}</p><div class="result-stars" aria-label="이번 기록 별 ${score===5?3:score===4?2:0}개">${score===5?'★★★':score===4?'★★☆':'☆☆☆'}</div><div class="result-metrics"><div><strong>${score} / 5</strong><small>맞힌 문제</small></div><div><strong>${score*20}%</strong><small>정답률</small></div></div><div class="result-buttons"><a class="btn secondary" href="#topic/${g.s}/${g.t}">단계 목록</a>${pass&&g.l<2?`<button class="btn primary" data-action="start" data-s="${g.s}" data-t="${g.t}" data-l="${g.l+1}">다음 단계로 ${icon('arrow',15)}</button>`:`<button class="btn primary" data-action="start" data-s="${g.s}" data-t="${g.t}" data-l="${g.l}">새 문제로 다시 도전</button>`}</div>${score<5?'<div class="result-list">틀린 문제는 복습 노트에 담았어요. <a class="text-link" href="#review">오답 복습하기 →</a></div>':''}</div>`;}
function records(){nav('records');const n=state.history.length,correct=state.history.filter(h=>h.correct).length;return `<div class="page-heading"><div class="eyebrow">MY LEARNING JOURNEY</div><h1>나의 학습 기록</h1><p>차곡차곡 쌓인 도전이 나의 실력이 돼요.</p></div>${statCards()}<div class="record-grid"><section class="panel"><div class="panel-head"><h3>세계별 탐험 현황</h3><span>120단계의 여정</span></div>${subjects.map((v,s)=>`<a href="#subject/${s}" class="record-row"><span class="nav-symbol ${v.color}" style="color:var(--accent)">${v.symbol}</span><div class="name">${v.name}<small>완료율 ${Math.round(done(s)/30*100)}%</small></div><strong>${done(s)} / 30</strong>${icon('arrow',15)}</a>`).join('')}</section><section class="panel"><div class="panel-head"><h3>나의 도전 발자국</h3><span>모든 풀이 기록</span></div><div class="record-row"><span class="name">지금까지 푼 문제</span><strong>${n}문제</strong></div><div class="record-row"><span class="name">전체 정답률</span><strong>${n?Math.round(correct/n*100):0}%</strong></div><div class="record-row"><span class="name">복습을 기다리는 문제</span><strong>${state.mistakes.length}문제</strong></div><a href="#review" class="btn light" style="margin-top:20px">오답 복습하기 ${icon('arrow',14)}</a><p class="small-text" style="margin-top:15px">틀린 문제는 최근 120개까지 보관해요. 복습에서 맞히면 목록에서 사라져요.</p></section></div><p class="small-text" style="margin-top:23px">기록은 이 기기의 현재 브라우저에 저장돼요. 다른 기기나 브라우저와 동기화되지 않으며, 브라우저 데이터를 지우면 기록도 사라져요.</p><button class="danger-link" data-action="reset">내 학습 기록 초기화</button>`;}
function badges(){nav('badges');const defs=[['🌱','첫 발자국','첫 번째 단계를 완료해요.',total()>=1],['⭐','반짝이는 수집가','별을 15개 이상 모아요.',stars()>=15],['🔥','꾸준한 탐험가','3일 연속 문제를 풀어요.',streak()>=3],['◇','도형 탐정','사각형과 삼각형에서 각각 5단계를 완료해요.',done(0)>=5&&done(1)>=5],['✦','계산의 달인','곱셈·나눗셈과 소수에서 각각 5단계를 완료해요.',done(2)>=5&&done(3)>=5],['🏆','수학 탐험 대장','네 세계의 120단계를 모두 완료해요.',total()===120]].map((d,i)=>[d[0],d[1],d[2],d[3]||(state.badges||[]).includes(i)]);return `<div class="page-heading"><div class="eyebrow">MY LITTLE ACHIEVEMENTS</div><h1>배지 보관함</h1><p>노력의 순간마다 특별한 배지가 기다려요. ${defs.filter(d=>d[3]).length} / 6개 달성</p></div><div class="badge-grid">${defs.map(d=>`<section class="badge-card ${d[3]?'earned':''}"><div class="badge-medal">${d[0]}</div><h2>${d[1]}</h2><p>${d[2]}</p><div class="badge-status">${d[3]?'✓ 조건 달성!':'아직 탐험 중'}</div></section>`).join('')}</div>`;}
function reviewPage(){nav('review');if(review){return `<div class="quiz-shell"><button class="back-link" data-action="review-next">${icon('back',14)}복습 목록으로</button><div class="quiz-top"><div><h1>한 번 더 생각해 봐요</h1><p>${subjects[review.s].topics[review.t]} · 오답 복습</p></div></div>${questionHTML(review.q,!!review.answer,review.answer?.value,review.answer?.correct)}</div>`;}
 return `<div class="page-heading"><div class="eyebrow">ONE MORE TRY</div><h1>나의 복습 노트</h1><p>틀린 문제도 좋은 배움이 돼요. 차근차근 다시 풀어봐요.</p></div>${state.mistakes.length?`<div class="review-list">${state.mistakes.map(m=>`<section class="review-card"><div class="review-copy"><small>${subjects[m.s].name} · ${subjects[m.s].topics[m.t]} · ${stageNames[m.l]}</small><h3>${esc(m.q.prompt)} ${m.q.equation?esc(m.q.equation):''}</h3></div><button class="btn light" data-action="review" data-id="${m.id}">다시 풀기 ${icon('arrow',13)}</button></section>`).join('')}</div>`:`<div class="panel empty">${icon('book',35)}<p style="margin:20px 0">아직 복습할 문제가 없어요.<br>틀린 문제가 생기면 이곳에 모아드릴게요.</p><a href="#home" class="btn primary">탐험하러 가기</a></div>`}`;}
function render(){const parts=location.hash.slice(1).split('/'),route=parts[0]||'home',s=Number(parts[1]),t=Number(parts[2]),l=Number(parts[3]);let html;
 if(['subject','topic','play'].includes(route)&&(!Number.isInteger(s)||s<0||s>3)){location.hash='home';return;}
 if(['topic','play'].includes(route)&&(!Number.isInteger(t)||t<0||t>9)){location.hash='home';return;}
 if(route==='play'&&(!Number.isInteger(l)||l<0||l>2)){location.hash='home';return;}
 if(route!=='review')review=null;
 html=route==='subject'?subjectPage(s):route==='topic'?topicPage(s,t):route==='play'?quizPage(s,t,l):route==='records'?records():route==='badges'?badges():route==='review'?reviewPage():home();
 $('#main').innerHTML=(!storageOK?'<p class="storage-warning">현재 브라우저에서는 기록을 저장할 수 없어요. 이번 접속 동안만 기록이 유지돼요.</p>':'')+html;
 document.title=`${route==='play'?subjects[s].topics[t]:route==='subject'?subjects[s].name:route==='topic'?subjects[s].topics[t]:route==='records'?'나의 학습 기록':route==='badges'?'배지 보관함':'수학 탐험대'} · 수학 탐험대`;
 $('#answer-form')?.addEventListener('submit',e=>{e.preventDefault();answerQuestion();});
}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3300);}
function dialog(body){$('#modal').innerHTML=body;$('#modal').showModal();}
function closeButton(){return '<div class="actions"><button class="btn primary" data-action="close">알겠어요</button></div>';}
function help(){dialog(`<h2>수학 탐험, 이렇게 시작해요</h2><ul><li>네 세계에서 마음에 드는 주제를 골라요.</li><li>기본 → 연습 → 도전, 각 단계에 5문제가 있어요.</li><li>4문제 이상 맞히면 다음 단계가 열려요. 4개 정답은 별 2개, 5개 정답은 별 3개예요.</li><li>별은 각 단계의 최고 기록만큼 모여요. 다시 풀면 최고 기록을 높일 수 있어요.</li><li>틀린 문제는 학습 기록의 복습 노트에서 다시 풀어요.</li><li>친구에게 링크를 보내면 각자의 브라우저에서 독립적으로 탐험할 수 있어요.</li></ul><p>기록은 현재 브라우저에만 저장돼요. 회원가입이나 이름 입력은 필요 없어요.</p><button class="text-link" data-action="curriculum">교육과정 참고 내용 보기 →</button>${closeButton()}`);}
function curriculum(){if($('#modal').open)$('#modal').close();dialog(`<h2>교육과정에 맞춘 탐험</h2><p>제공해 주신 「[별책8] 수학과 교육과정」의 2022 개정 초등 3~4학년 성취기준을 참고해 만든 창작 연습 문제예요. 공식 교과서 문항이나 교육과정 전체를 대체하는 자료는 아니에요.</p><ul><li>사각형: 수직·평행, 도형의 분류와 성질, 각의 합</li><li>삼각형: 변과 각에 따른 분류, 성질, 각의 합</li><li>곱셈·나눗셈: 세 자리 수 범위, 한 자리·두 자리 수로 계산하기, 실생활 문제</li><li>소수: 자릿값과 크기 비교, 소수 두 자리 수 범위의 덧셈·뺄셈</li></ul><p>구구단 등은 기초 복습으로 포함했어요. 5~6학년의 둘레·넓이 공식은 이 탐험에 포함하지 않아요.</p><p>참고: 문서 본문 17~22쪽 (PDF 23~28쪽). 도형 분류와 계산 원리를 익히는 학습을 중심으로 구성했어요.</p>${closeButton()}`);}
async function share(){if(location.protocol==='file:'){dialog(`<h2>친구와 함께 탐험해요</h2><p>지금은 파일 버전으로 실행 중이에요. 받은 HTML 파일을 친구에게 보내면 각자 브라우저에서 탐험할 수 있어요.</p><p>인터넷에 사이트를 게시한 뒤에는 이 버튼으로 공유 링크를 복사할 수 있어요.</p>${closeButton()}`);return;}const url=location.origin+location.pathname+location.hash;try{await navigator.clipboard.writeText(url);toast('현재 탐험 링크를 복사했어요! 친구에게 보내 주세요.');}catch{dialog(`<h2>친구와 함께 탐험해요</h2><p>아래 링크를 복사해서 보내 주세요.</p><input aria-label="공유할 링크" readonly value="${esc(url)}">${closeButton()}`);$('#modal input').select();}}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const div=document.createElement('div');div.className='confetti';div.innerHTML=Array.from({length:32},(_,i)=>`<i style="left:${Math.random()*100}%;background:${['#d5b94d','#82aa72','#e5b685','#b1a0ce'][i%4]};animation-delay:${Math.random()*.5}s"></i>`).join('');document.body.append(div);setTimeout(()=>div.remove(),3100);}
document.addEventListener('click',e=>{if(e.target.closest('a[href^="#"]'))$('#sidebar').classList.remove('open');const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const act=b.dataset.action;
 if(act==='start')start(+b.dataset.s,+b.dataset.t,+b.dataset.l);
 if(act==='choose'){selected=b.dataset.value;error='';document.querySelectorAll('.choice').forEach(c=>{c.classList.toggle('selected',c.dataset.value===selected);c.setAttribute('aria-pressed',c.dataset.value===selected);});}
 if(act==='hint'){if($('#answer'))selected=$('#answer').value;hint=!hint;render();}
 if(act==='next')next();if(act==='help')help();if(act==='curriculum')curriculum();if(act==='close')$('#modal').close();if(act==='share')share();
 if(act==='menu'){$('#sidebar').classList.toggle('open');let scrim=$('.mobile-scrim');if(!scrim){scrim=document.createElement('button');scrim.className='mobile-scrim';scrim.setAttribute('aria-label','메뉴 닫기');$('#sidebar').after(scrim);scrim.onclick=()=>$('#sidebar').classList.remove('open');}}
 if(act==='review'){review={...state.mistakes.find(m=>m.id===b.dataset.id)};selected='';hint=false;error='';render();scrollTo(0,0);}
 if(act==='review-next'){review=null;selected='';hint=false;error='';render();}
 if(act==='reset')dialog('<h2>학습 기록을 초기화할까요?</h2><p>이 브라우저의 단계 기록, 별, 풀이 기록과 복습 노트가 모두 지워져요. 지운 기록은 되돌릴 수 없어요.</p><div class="actions"><button class="btn secondary" data-action="close">취소</button><button class="btn primary" data-action="confirm-reset">초기화하기</button></div>');
 if(act==='confirm-reset'){state=fresh();save();$('#modal').close();render();toast('학습 기록을 초기화했어요. 새 탐험을 시작해 봐요.');}
});
window.addEventListener('hashchange',()=>{selected='';hint=false;error='';$('#sidebar').classList.remove('open');render();scrollTo(0,0);$('#main').focus({preventScroll:true});});
render();
</script>
</body>
</html>
